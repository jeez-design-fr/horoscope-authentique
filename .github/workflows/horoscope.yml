name: Horoscope Quotidien

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
    - name: Récupérer le code
      uses: actions/checkout@v4

    - name: Installer Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Installer les dépendances
      run: npm ci

    - name: Compiler le CSS (Tailwind)
      run: npm run build:css

    # Calcule le ciel réel (astronomy-engine), fait rédiger l'horoscope par Gemini
    # à partir de ces positions, réécrit quelques articles, puis régénère le site.
    - name: Générer le site
      env:
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      run: node generator.js

    - name: Sauvegarder et Publier
      run: |
        git config --global user.name "Oracle Automatique"
        git config --global user.email "oracle@horoscope-authentique.fr"
        git add public data content assets/style.css
        git commit -m "🔮 Mise à jour quotidienne des astres" || echo "Pas de changement"
        git push

    # Prévient Bing / ChatGPT / Copilot des pages modifiées (IndexNow, gratuit).
    # On laisse 2 minutes à Vercel pour mettre la nouvelle version en ligne.
    - name: Signaler les pages à Bing (IndexNow)
      run: |
        sleep 120
        node indexnow.js

    - name: Publier sur Bluesky
      env:
        BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
        BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      run: node post-bluesky.js
